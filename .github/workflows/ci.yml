name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查
        run: |
          git ls-files '*.mjs' '*.js' | while read -r f; do node --check "$f"; done
      - name: acp-pool 单测（纯逻辑，无需 DSH）
        run: |
          cd acp-pool
          node --test test/*.test.mjs
